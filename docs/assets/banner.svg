<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Clean White Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <g transform="translate(640, 310)" text-anchor="middle">
    <!-- Authentic 3D Shopify Bag with Shield Emblem -->
    <g transform="translate(-15, -70)">
      <!-- Back Handle (Shadowed Green) -->
      <path d="M -20 -75 C -25 -130 20 -130 22 -75" fill="none" stroke="#5E8E3E" stroke-width="11" stroke-linecap="round" />
      
      <!-- Front Handle (Shopify Green) -->
      <path d="M -48 -65 C -55 -125 -5 -125 0 -65" fill="none" stroke="#95BF47" stroke-width="13" stroke-linecap="round" />

      <!-- Right Side Shadow Face (Dark Green) -->
      <polygon points="30,-75 105,-50 150,102 35,145" fill="#5E8E3E" />
      
      <!-- Top Fold Notch Detail -->
      <polygon points="30,-75 60,-65 35,145" fill="#4B7431" opacity="0.3" />

      <!-- Main Front Face (Bright Shopify Green) -->
      <polygon points="-95,-45 30,-75 35,145 -65,108" fill="#95BF47" />

      <!-- White Shield Emblem (Replacing the 'S' logo) -->
      <g transform="translate(-18, 32) rotate(-5) scale(1.2)">
        <!-- Crisp White Shield -->
        <path d="M 0 -42 L 28 -30 C 28 2 20 28 0 45 C -20 28 -28 2 -28 -30 Z" fill="#FFFFFF" />
        <!-- Keyhole Cutout -->
        <circle cx="0" cy="-4" r="7" fill="#95BF47" />
        <polygon points="-4,-4 4,-4 5,16 -5,16" fill="#95BF47" />
      </g>
    </g>

    <!-- Main Title (Bold Dark Slate/Black) -->
    <text y="175" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1">ShopifyAutoAuth</text>

    <!-- Subtitle (Clean Grey) -->
    <text y="220" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="4">OAUTH 2.0 CLIENT CREDENTIALS ADAPTER</text>
  </g>
</svg>
