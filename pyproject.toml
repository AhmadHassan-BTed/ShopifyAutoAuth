[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "shopify-auth-adapter"
version = "1.0.0"
description = "Shopify Admin API authentication adapter — Client Credentials Grant with automatic token refresh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "shopify",
    "shopify-api",
    "authentication",
    "oauth2",
    "client-credentials",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------

dependencies = [
    # HTTP client — modern, async-ready, type-annotated.
    # Minimum 0.27 for httpx.Timeout(overall, connect=...) API.
    "httpx>=0.27.0",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------

[project.optional-dependencies]

# Development tools — install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",          # httpx request mocking
    "python-dotenv>=1.0",   # .env file support for manual testing
    "ruff>=0.4",            # linter + formatter
    "mypy>=1.10",           # static type checker
]

# Convenience: load .env files automatically (recommended for local dev)
dotenv = [
    "python-dotenv>=1.0",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["shopify_auth_adapter"]
