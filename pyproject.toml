[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "shopify-auth-adapter"
version = "1.0.0"
description = "Shopify Admin API authentication adapter — Client Credentials Grant with automatic token refresh"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ahmad Hassan" }
]
requires-python = ">=3.10"
keywords = [
    "shopify",
    "shopify-api",
    "authentication",
    "oauth2",
    "client-credentials",
    "httpx",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------

dependencies = [
    "httpx>=0.27.0",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------

[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "python-dotenv>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

dotenv = [
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/AhmadHassan-BTed/ShopifyAutoAuth"
Documentation = "https://github.com/AhmadHassan-BTed/ShopifyAutoAuth#readme"
Repository = "https://github.com/AhmadHassan-BTed/ShopifyAutoAuth.git"
Issues = "https://github.com/AhmadHassan-BTed/ShopifyAutoAuth/issues"
Changelog = "https://github.com/AhmadHassan-BTed/ShopifyAutoAuth/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["core", "cache", "auth", "client"]

[tool.hatch.build.targets.wheel.sources]
"core" = "shopify_auth_adapter/core"
"cache" = "shopify_auth_adapter/cache"
"auth" = "shopify_auth_adapter/auth"
"client" = "shopify_auth_adapter/client"
"__init__.py" = "shopify_auth_adapter/__init__.py"
"py.typed" = "shopify_auth_adapter/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
files = ["core", "cache", "auth", "client", "__init__.py"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_errors = false
