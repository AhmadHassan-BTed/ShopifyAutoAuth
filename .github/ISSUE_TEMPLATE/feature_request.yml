name: Feature Request
description: Suggest an idea or enhancement for shopify_auth_adapter
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for contributing ideas to make shopify_auth_adapter better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
